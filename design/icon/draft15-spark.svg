<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 变体 15：一屏一点缀——满幅白屏 + 右下橙色投送徽章（最克制的构图） -->
  <defs>
    <linearGradient id="bg15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39ADFF"/>
      <stop offset="1" stop-color="#1A56DB"/>
    </linearGradient>
    <linearGradient id="scr15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66C6FF"/>
      <stop offset="1" stop-color="#2268E8"/>
    </linearGradient>
    <filter id="sh15" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#06205E" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg15)"/>
  <!-- 满幅大屏（白框，占满留呼吸边） -->
  <g filter="url(#sh15)">
    <rect x="64" y="96" width="384" height="272" rx="36" fill="#FFFFFF"/>
    <rect x="92" y="124" width="328" height="216" rx="16" fill="url(#scr15)"/>
    <!-- 屏幕内：左上手机剪影 + 右侧光斑 -->
    <rect x="118" y="148" width="64" height="110" rx="12" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="330" cy="256" r="34" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="330" cy="256" r="20" fill="#FFFFFF" opacity="0.4"/>
  </g>
  <!-- 右下角橙色投送徽章 -->
  <circle cx="392" cy="392" r="58" fill="#FF9F1C" filter="url(#sh15)"/>
  <g stroke="#FFFFFF" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="366" y1="412" x2="412" y2="374"/>
    <polyline points="412,398 414,372 388,372"/>
  </g>
</svg>

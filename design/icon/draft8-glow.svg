<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 变体 8：辉光特写——大屏幕几乎撑满画面，屏幕里映着手机，中心辉光 -->
  <defs>
    <radialGradient id="glow8" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0" stop-color="#4FC3FF"/>
      <stop offset="0.55" stop-color="#2A7FFF"/>
      <stop offset="1" stop-color="#1338B0"/>
    </radialGradient>
    <linearGradient id="scr8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BC2FF"/>
      <stop offset="1" stop-color="#1E56D6"/>
    </linearGradient>
    <filter id="sh8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A2470" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#glow8)"/>
  <!-- 大屏幕（特写，左右出血） -->
  <g filter="url(#sh8)">
    <rect x="66" y="118" width="380" height="256" rx="32" fill="#FFFFFF"/>
    <rect x="90" y="142" width="332" height="208" rx="18" fill="url(#scr8)"/>
    <!-- 屏幕中映出的手机 -->
    <rect x="198" y="160" width="116" height="172" rx="20" fill="#FFFFFF"/>
    <rect x="214" y="180" width="84" height="118" rx="10" fill="#1E56D6" opacity="0.92"/>
    <rect x="234" y="306" width="44" height="10" rx="5" fill="#1E56D6" opacity="0.92"/>
    <!-- 屏幕内小光点：正在投射 -->
    <circle cx="150" cy="188" r="7" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="172" cy="172" r="5" fill="#FFFFFF" opacity="0.55"/>
  </g>
  <!-- 底座 -->
  <rect x="222" y="382" width="68" height="26" fill="#FFFFFF" opacity="0.95"/>
  <rect x="176" y="404" width="160" height="20" rx="10" fill="#FFFFFF" opacity="0.95"/>
</svg>

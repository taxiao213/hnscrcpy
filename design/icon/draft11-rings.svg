<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 变体 11：同心扩散——手机居中发出三层光圈，外圈化成屏幕四角（投影涟漪） -->
  <defs>
    <radialGradient id="glow11" cx="0.5" cy="0.55" r="0.8">
      <stop offset="0" stop-color="#3FC0FF"/>
      <stop offset="0.6" stop-color="#2278F5"/>
      <stop offset="1" stop-color="#1240B4"/>
    </radialGradient>
    <filter id="sh11" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#072260" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#glow11)"/>
  <!-- 三层扩散光圈（由内向外渐淡） -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <circle cx="256" cy="268" r="66"  stroke-width="14" opacity="0.9"/>
    <circle cx="256" cy="268" r="112" stroke-width="12" opacity="0.5"/>
    <circle cx="256" cy="268" r="158" stroke-width="10" opacity="0.25"/>
  </g>
  <!-- 中央手机（白实底） -->
  <g filter="url(#sh11)">
    <rect x="216" y="216" width="80" height="150" rx="18" fill="#FFFFFF"/>
    <rect x="229" y="234" width="54" height="100" rx="8" fill="#1E56D6" opacity="0.9"/>
  </g>
  <!-- 顶部弧线上的一颗投影星（青色） -->
  <circle cx="256" cy="110" r="14" fill="#9FE8FF"/>
</svg>

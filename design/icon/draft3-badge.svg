<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 变体 3：亮蓝底 + 白色圆形徽章内的极简投射图形（小尺寸更清晰） -->
  <rect width="512" height="512" rx="96" fill="#0EA5FF"/>
  <circle cx="256" cy="256" r="176" fill="#FFFFFF"/>
  <!-- 手机 -->
  <g stroke="#0EA5FF" stroke-width="14" fill="none" stroke-linejoin="round">
    <rect x="128" y="180" width="86" height="152" rx="16"/>
  </g>
  <!-- 光束箭头 -->
  <g stroke="#0EA5FF" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="234" y1="256" x2="282" y2="256"/>
    <polyline points="266,240 284,256 266,272"/>
  </g>
  <!-- 显示器 -->
  <g stroke="#0EA5FF" stroke-width="14" fill="none" stroke-linejoin="round">
    <rect x="302" y="180" width="90" height="110" rx="12"/>
    <line x1="330" y1="316" x2="364" y2="316"/>
    <line x1="347" y1="290" x2="347" y2="316"/>
  </g>
</svg>

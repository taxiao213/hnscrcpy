<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 变体 7：斜向光束投影——手机在左下，光束放大成屏在右上，动感对角构图 -->
  <defs>
    <linearGradient id="bg7" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1E6DF0"/>
      <stop offset="1" stop-color="#37C6FF"/>
    </linearGradient>
    <linearGradient id="beam7" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg7)"/>
  <!-- 放大光束（梯形，半透明白） -->
  <polygon points="150,336 118,404 300,190 268,170" fill="url(#beam7)"/>
  <!-- 右上大屏（白框） -->
  <rect x="268" y="96" width="184" height="140" rx="20" fill="none" stroke="#FFFFFF" stroke-width="20"/>
  <rect x="292" y="120" width="136" height="92" rx="8" fill="#FFFFFF" opacity="0.35"/>
  <!-- 左下手机（白实底） -->
  <rect x="96" y="300" width="96" height="160" rx="20" fill="#FFFFFF"/>
  <rect x="112" y="324" width="64" height="96" rx="8" fill="#2563EB" opacity="0.9"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 变体 14：层叠流——三个层叠圆角屏由实到虚（投送链），最前层带播放三角 -->
  <defs>
    <linearGradient id="bg14" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43B4FF"/>
      <stop offset="1" stop-color="#1852D6"/>
    </linearGradient>
    <filter id="sh14" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06205E" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg14)"/>
  <!-- 后层（最虚） -->
  <rect x="196" y="120" width="240" height="160" rx="24" fill="#FFFFFF" opacity="0.30"/>
  <!-- 中层 -->
  <rect x="166" y="150" width="240" height="160" rx="24" fill="#FFFFFF" opacity="0.55"/>
  <!-- 前层（实）+ 播放三角 -->
  <g filter="url(#sh14)">
    <rect x="128" y="184" width="248" height="168" rx="24" fill="#FFFFFF"/>
    <path d="M 226 232 L 288 268 L 226 304 Z" fill="#1852D6"/>
  </g>
  <!-- 底部光点链 -->
  <circle cx="128" cy="396" r="7" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="160" cy="396" r="9" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="200" cy="396" r="12" fill="#FFFFFF"/>
</svg>

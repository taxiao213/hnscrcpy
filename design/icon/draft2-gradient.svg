<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 变体 2：蓝色渐变 + 白色实底剪影，弧形光束 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FACFE"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 手机实底 -->
  <rect x="84" y="150" width="118" height="204" rx="24" fill="#FFFFFF"/>
  <rect x="104" y="180" width="78" height="130" rx="10" fill="#2563EB" opacity="0.85"/>
  <!-- 弧形光束 -->
  <g stroke="#FFFFFF" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M 226 220 Q 278 196 322 220" stroke-width="18"/>
    <path d="M 226 256 Q 278 232 330 256" stroke-width="18" opacity="0.6"/>
  </g>
  <g fill="#FFFFFF">
    <polygon points="318,204 342,228 306,232"/>
  </g>
  <!-- 显示器实底 -->
  <rect x="322" y="150" width="128" height="158" rx="18" fill="#FFFFFF"/>
  <rect x="342" y="172" width="88" height="98" rx="10" fill="#2563EB" opacity="0.85"/>
  <rect x="368" y="308" width="36" height="34" fill="#FFFFFF"/>
  <rect x="344" y="340" width="84" height="16" rx="8" fill="#FFFFFF"/>
</svg>

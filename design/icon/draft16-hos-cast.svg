<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 变体 16：HarmonyOS 规范——手机→光束→显示器，渐变主体 + 软投影 + 背景斜向高光 -->
  <defs>
    <linearGradient id="bg16" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BBCFF"/>
      <stop offset="1" stop-color="#2160E8"/>
    </linearGradient>
    <linearGradient id="gl16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8EBFF"/>
    </linearGradient>
    <filter id="sh16" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A2E80" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg16)"/>
  <!-- 左上斜向高光（HarmonyOS 质感） -->
  <path d="M 0 0 L 512 0 L 0 400 Z" fill="#FFFFFF" opacity="0.10"/>
  <!-- 手机 -->
  <g filter="url(#sh16)">
    <rect x="92" y="158" width="104" height="188" rx="24" fill="url(#gl16)"/>
  </g>
  <rect x="110" y="184" width="68" height="122" rx="12" fill="#2E7BF0" opacity="0.55"/>
  <!-- 光束（圆头三层） -->
  <g stroke-linecap="round" fill="none">
    <line x1="222" y1="252" x2="292" y2="252" stroke="url(#gl16)" stroke-width="20"/>
    <line x1="218" y1="212" x2="266" y2="212" stroke="#FFFFFF" stroke-width="14" opacity="0.55"/>
    <line x1="218" y1="292" x2="266" y2="292" stroke="#FFFFFF" stroke-width="14" opacity="0.55"/>
  </g>
  <polygon points="288,226 320,252 288,278" fill="#FFFFFF"/>
  <!-- 显示器 -->
  <g filter="url(#sh16)">
    <rect x="318" y="150" width="128" height="140" rx="20" fill="url(#gl16)"/>
    <rect x="336" y="168" width="92" height="80" rx="10" fill="#2E7BF0" opacity="0.55"/>
    <path d="M 366 290 L 366 322 M 344 322 L 422 322" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>

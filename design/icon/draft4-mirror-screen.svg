<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 变体 4：镜像屏——显示器中映出手机，单主体聚焦 -->
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="scr4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60C5FF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg4)"/>
  <!-- 显示器外框（白，带轻投影） -->
  <g>
    <rect x="106" y="128" width="300" height="212" rx="26" fill="#FFFFFF"/>
    <rect x="128" y="150" width="256" height="168" rx="14" fill="url(#scr4)"/>
    <!-- 屏幕中映出的手机（白剪影） -->
    <rect x="212" y="168" width="88" height="132" rx="14" fill="#FFFFFF"/>
    <rect x="226" y="184" width="60" height="88" rx="6" fill="#2563EB" opacity="0.9"/>
    <rect x="240" y="280" width="32" height="7" rx="3.5" fill="#2563EB" opacity="0.9"/>
  </g>
  <!-- 支架 -->
  <rect x="238" y="340" width="36" height="30" fill="#FFFFFF"/>
  <rect x="196" y="366" width="120" height="18" rx="9" fill="#FFFFFF"/>
</svg>

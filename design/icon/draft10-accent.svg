<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 变体 10：点缀色方案——蓝底白徽章内双色图形（青蓝屏幕 + 橙黄投射箭头） -->
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#1663E0"/>
    </linearGradient>
    <filter id="sh10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#08306B" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg10)"/>
  <circle cx="256" cy="256" r="182" fill="#FFFFFF"/>
  <!-- 显示器（青蓝描边） -->
  <g stroke="#1E6DF0" stroke-width="15" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="252" y="150" width="118" height="96" rx="14"/>
    <line x1="286" y1="278" x2="336" y2="278"/>
    <line x1="311" y1="246" x2="311" y2="278"/>
  </g>
  <rect x="272" y="168" width="78" height="60" rx="8" fill="#1E6DF0" opacity="0.15"/>
  <!-- 手机（青蓝实底） -->
  <rect x="130" y="150" width="84" height="128" rx="16" fill="#1E6DF0" filter="url(#sh10)"/>
  <!-- 投射箭头（橙色点缀，能量感） -->
  <g stroke="#FF9F1C" stroke-width="17" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="222" y1="212" x2="238" y2="212"/>
    <line x1="216" y1="188" x2="226" y2="188"/>
    <line x1="216" y1="236" x2="226" y2="236"/>
    <polyline points="230,152 252,150" opacity="0"/>
  </g>
  <path d="M 224 212 L 246 212" stroke="#FF9F1C" stroke-width="18" stroke-linecap="round"/>
  <path d="M 232 194 L 246 212 L 232 230" fill="none" stroke="#FF9F1C" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

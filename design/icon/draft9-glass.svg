<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 变体 9：玻璃投射——深蓝底上的玻璃大屏，白实手机投出光束 -->
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2A66"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="beam9" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9BE0FF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="sh9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg9)"/>
  <!-- 玻璃大屏（半透明 + 亮边） -->
  <g filter="url(#sh9)">
    <rect x="196" y="104" width="228" height="170" rx="26" fill="#FFFFFF" opacity="0.18"/>
    <rect x="196" y="104" width="228" height="170" rx="26" fill="none" stroke="#BFE6FF" stroke-width="6" opacity="0.9"/>
    <rect x="220" y="128" width="180" height="122" rx="14" fill="#7FD4FF" opacity="0.35"/>
  </g>
  <!-- 光束：手机指向玻璃屏 -->
  <polygon points="128,344 96,398 218,252 192,236" fill="url(#beam9)"/>
  <!-- 手机（白实底） -->
  <g filter="url(#sh9)">
    <rect x="88" y="288" width="104" height="172" rx="22" fill="#FFFFFF"/>
    <rect x="106" y="312" width="68" height="106" rx="10" fill="#2563EB" opacity="0.9"/>
  </g>
</svg>

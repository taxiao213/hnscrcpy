name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # release job 需要创建 GitHub Release

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS-arm64
          - os: macos-15-intel # macos-13 已退役（2025 年底下线），Intel 构建用 macos-15-intel
            label: macOS-x86_64
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install deb packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils
      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        run: ./scripts/build-package.sh
        env:
          INSTALLER: "1" # CI 产出安装包；本地默认只出免安装 app-image
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: ./scripts/build-package.ps1
        env:
          INSTALLER: "1"
      # 产物命名：hnscrcpy-<tag>-<平台>.<格式>（tag v1.0.0 → hnscrcpy-v1.0.0-macOS-arm64.dmg；
      # main 分支构建时 ref_name=main，产物为 hnscrcpy-main-* 仅作 CI 验证）
      - name: Stage release asset (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/release-assets
          cp target/dist/*.dmg "target/release-assets/hnscrcpy-${{ github.ref_name }}-${{ matrix.label }}.dmg"
      - name: Stage release asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release-assets | Out-Null
          Copy-Item target/dist/*.exe "target/release-assets/hnscrcpy-${{ github.ref_name }}-${{ matrix.label }}-setup.exe"
      - name: Stage release assets (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/release-assets
          cp target/dist/*.deb "target/release-assets/hnscrcpy-${{ github.ref_name }}-${{ matrix.label }}.deb"
          tar -C target/dist -czf "target/release-assets/hnscrcpy-${{ github.ref_name }}-${{ matrix.label }}.tar.gz" hnscrcpy
      - uses: actions/upload-artifact@v4
        with:
          name: hnscrcpy-${{ github.ref_name }}-${{ matrix.label }}
          path: target/release-assets/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # release 正文读 docs/RELEASE_NOTES.md
      - uses: actions/download-artifact@v4
        with:
          pattern: hnscrcpy-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
